      function addNearestOverlay(svg, width, height, margins, scaleX, data, valueX, valueY, tooltipText) {
        const guide = svg.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;lk-guide&quot;).style(&quot;display&quot;, &quot;none&quot;);
        const marker = svg.append(&quot;circle&quot;).attr(&quot;class&quot;, &quot;lk-hover-marker&quot;).attr(&quot;r&quot;, 5).style(&quot;display&quot;, &quot;none&quot;);
        svg.append(&quot;rect&quot;)
          .attr(&quot;class&quot;, &quot;lk-overlay&quot;)
          .attr(&quot;data-chart-hit&quot;, &quot;&quot;)
          .attr(&quot;x&quot;, margins.left).attr(&quot;y&quot;, margins.top)
          .attr(&quot;width&quot;, width - margins.left - margins.right)
          .attr(&quot;height&quot;, height - margins.top - margins.bottom)
          .on(&quot;pointermove&quot;, event =&gt; {
            const [pointerX] = d3.pointer(event);
            const target = scaleX.invert(pointerX);
            const index = d3.bisector(valueX).center(data, target);
            const d = data[index];
            guide.style(&quot;display&quot;, null)
              .attr(&quot;x1&quot;, scaleX(valueX(d))).attr(&quot;x2&quot;, scaleX(valueX(d)))
              .attr(&quot;y1&quot;, margins.top).attr(&quot;y2&quot;, height - margins.bottom);
            marker.style(&quot;display&quot;, null)
              .attr(&quot;cx&quot;, scaleX(valueX(d))).attr(&quot;cy&quot;, valueY(d));
            showTooltip(event, tooltipText(d));
          })
          .on(&quot;pointerleave&quot;, () =&gt; {
            guide.style(&quot;display&quot;, &quot;none&quot;);
            marker.style(&quot;display&quot;, &quot;none&quot;);
            hideTooltip();
          });
      }

      function drawSender(snapshot) {
        const container = root.querySelector(&quot;#lk05-sender-chart&quot;);
        container.innerHTML = &quot;&quot;;
        const width = Math.max(300, Math.round(container.getBoundingClientRect().width));
        const height = 310;
        const margins = { top: 16, right: 20, bottom: 46, left: 64 };
        const svg = d3.select(container).append(&quot;svg&quot;)
          .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
          .attr(&quot;aria-label&quot;, `Sender policy at level ${snapshot.level}`);
        const x = d3.scaleLinear().domain([0, 100]).range([margins.left, width - margins.right]);
        const y = d3.scaleLinear().domain([0, 50]).range([height - margins.bottom, margins.top]);
        const xTicks = width &lt; 430 ? [0, 50, 100] : [0, 20, 40, 60, 80, 100];
        const yTicks = width &lt; 430 ? [0, 20, 40, 50] : [0, 10, 20, 30, 40, 50];
        addAxes(svg, width, height, margins, x, y, xTicks, yTicks, &quot;State θ&quot;, &quot;Message m&quot;);
        if (!snapshot.sender) {
          svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;lk-empty&quot;)
            .attr(&quot;x&quot;, margins.left + (width - margins.left - margins.right) / 2)
            .attr(&quot;y&quot;, margins.top + (height - margins.top - margins.bottom) / 2)
            .text(&quot;Sender reasoning begins at Level 1&quot;);
          return;
        }
        const data = states.map(state =&gt; ({ state, message: snapshot.sender[state] }));
        svg.append(&quot;path&quot;).datum(data).attr(&quot;class&quot;, &quot;lk-line-sender&quot;)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; x(d.state)).y(d =&gt; y(d.message)));
        svg.selectAll(&quot;circle.lk-dot-sender&quot;).data(data).join(&quot;circle&quot;)
          .attr(&quot;class&quot;, &quot;lk-dot-sender&quot;)
          .attr(&quot;cx&quot;, d =&gt; x(d.state)).attr(&quot;cy&quot;, d =&gt; y(d.message)).attr(&quot;r&quot;, 2.2);
        addNearestOverlay(svg, width, height, margins, x, data, d =&gt; d.state, d =&gt; y(d.message), d =&gt; {
          const guess = snapshot.receiver[d.message];
          return `State ${d.state} → message ${formatNumber(d.message)} → guess ${formatNumber(guess)}; error ${formatNumber(Math.abs(guess - d.state))}`;
        });
      }

      function drawReceiver(snapshot) {
        const container = root.querySelector(&quot;#lk05-receiver-chart&quot;);
        container.innerHTML = &quot;&quot;;
        const width = Math.max(300, Math.round(container.getBoundingClientRect().width));
        const height = 310;
        const margins = { top: 16, right: 20, bottom: 46, left: 64 };
        const svg = d3.select(container).append(&quot;svg&quot;)
          .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
          .attr(&quot;aria-label&quot;, `Receiver policy at level ${snapshot.level}`);
        const x = d3.scaleLinear().domain([0, 50]).range([margins.left, width - margins.right]);
        const y = d3.scaleLinear().domain([0, 100]).range([height - margins.bottom, margins.top]);
        const xTicks = width &lt; 430 ? [0, 25, 50] : [0, 10, 20, 30, 40, 50];
        const yTicks = width &lt; 430 ? [0, 40, 80, 100] : [0, 20, 40, 60, 80, 100];
        addAxes(svg, width, height, margins, x, y, xTicks, yTicks, &quot;Message m&quot;, &quot;Receiver guess g(m)&quot;);
        svg.append(&quot;path&quot;).datum([{ message: 0, guess: 0 }, { message: 50, guess: 50 }])
          .attr(&quot;class&quot;, &quot;lk-baseline&quot;)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; x(d.message)).y(d =&gt; y(d.guess)));
        const pools = poolsFor(snapshot);
        const data = messages.map(message =&gt; ({
          message,
          guess: snapshot.receiver[message],
          used: !snapshot.sender || pools[message].length &gt; 0,
          states: pools[message],
        }));
        const active = data.filter(d =&gt; d.used);
        svg.append(&quot;path&quot;).datum(active).attr(&quot;class&quot;, &quot;lk-line-receiver&quot;)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; x(d.message)).y(d =&gt; y(d.guess)));
        svg.selectAll(&quot;circle.lk-receiver-point&quot;).data(data).join(&quot;circle&quot;)
          .attr(&quot;class&quot;, d =&gt; `lk-receiver-point ${d.used ? &quot;lk-dot-receiver&quot; : &quot;lk-dot-unused&quot;}`)
          .attr(&quot;cx&quot;, d =&gt; x(d.message)).attr(&quot;cy&quot;, d =&gt; y(d.guess)).attr(&quot;r&quot;, d =&gt; d.used ? 2.8 : 2);
        addNearestOverlay(svg, width, height, margins, x, data, d =&gt; d.message, d =&gt; y(d.guess), d =&gt; {
          const source = d.states.length
            ? (d.states.length === 1 ? `state ${d.states[0]}` : `states ${d.states[0]}–${d.states[d.states.length - 1]}`)
            : &quot;unused; literal off-path interpretation&quot;;
          return `Message ${formatNumber(d.message)} → guess ${formatNumber(d.guess)} (${source})`;
        });
      }

      function render() {
        const snapshot = snapshots[currentLevel];
        slider.value = String(currentLevel);
        prev.disabled = currentLevel === 0;
        next.disabled = currentLevel === 68;
        levelLabel.textContent = `Level ${currentLevel} · ${snapshot.role}${currentLevel === 68 ? &quot; · stationary&quot; : &quot;&quot;}`;
        const mse = profileMse(snapshot);
        const used = snapshot.sender ? new Set(Object.values(snapshot.sender)).size : null;
        status.textContent = snapshot.sender
          ? `${snapshot.role} update · ${used} of 101 messages used · profile MSE ${mse.toFixed(6)}`
          : &quot;Receiver baseline · g(m) = m&quot;;
        senderSubtitle.textContent = currentLevel === 0
          ? &quot;Not yet specified&quot;
          : currentLevel % 2 ? &quot;Current best response&quot; : `Inherited from Level ${currentLevel - 1}`;
        receiverSubtitle.textContent = currentLevel === 0
          ? &quot;Current baseline&quot;
          : currentLevel % 2 ? `Beliefs inherited from Level ${currentLevel - 1}` : &quot;Current posterior-mean best response&quot;;
        detail.textContent = currentLevel === 68
          ? &quot;Stationary partition reached: 56 messages used; MSE 2.450495.&quot;
          : &quot;Move over either chart to inspect the mapping.&quot;;
        hideTooltip();
        drawSender(snapshot);
        drawReceiver(snapshot);
      }

      prev.addEventListener(&quot;click&quot;, () =&gt; { if (currentLevel &gt; 0) { currentLevel -= 1; render(); } });
      next.addEventListener(&quot;click&quot;, () =&gt; { if (currentLevel &lt; 68) { currentLevel += 1; render(); } });
      slider.addEventListener(&quot;input&quot;, () =&gt; { currentLevel = Number(slider.value); render(); });
      new ResizeObserver(() =&gt; render()).observe(root.querySelector(&quot;.lk-panels&quot;));
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;


&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
