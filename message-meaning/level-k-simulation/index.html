:root[data-theme=&quot;light&quot;] {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

.table :is(th, td):last-child {

  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;

  background: transparent !important;

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;

  align-items: center;

.btn:not(:disabled):hover {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;levelk-message-grid-viz&quot;);
      const cache = new Map();

      function arraysEqual(a, b) {
        if (!a || !b || a.length !== b.length) return false;
        for (let i = 0; i &lt; a.length; i += 1) if (a[i] !== b[i]) return false;
        return true;
      }

      function bestSender(states, receiver) {
        const order = Array.from({ length: receiver.length }, (_, i) =&gt; i)
          .sort((a, b) =&gt; receiver[a] - receiver[b] || a - b);
        const guesses = [];
        const messageIndices = [];
        order.forEach(index =&gt; {
          const guess = receiver[index];
          if (!guesses.length || Math.abs(guess - guesses[guesses.length - 1]) &gt; 1e-12) {
            guesses.push(guess);
            messageIndices.push(index);
          }
        });

        const result = new Uint16Array(states.length);
        states.forEach((state, stateIndex) =&gt; {
          let left = 0;
          let right = guesses.length;
          while (left &lt; right) {
            const middle = (left + right) &gt;&gt; 1;
            if (guesses[middle] &lt; state) left = middle + 1;
            else right = middle;
          }
          const low = Math.max(0, left - 1);
          const high = Math.min(guesses.length - 1, left);
          const lowError = Math.abs(guesses[low] - state);
          const highError = Math.abs(guesses[high] - state);
          result[stateIndex] = highError &lt; lowError - 1e-9 ||
            (Math.abs(highError - lowError) &lt;= 1e-9 &amp;&amp; messageIndices[high] &lt; messageIndices[low])
            ? messageIndices[high]
            : messageIndices[low];
        });
        return result;
      }

      function buildModel(stateDelta, messageDelta) {
        const key = `${stateDelta}|${messageDelta}`;
        if (cache.has(key)) return cache.get(key);
        const stateSteps = Math.round(100 / stateDelta);
        const messageSteps = Math.round(50 / messageDelta);
        const states = Float64Array.from(
          { length: stateSteps + 1 },
          (_, i) =&gt; Number((i * stateDelta).toFixed(2)),
        );
        const messages = Float64Array.from(
          { length: messageSteps + 1 },
          (_, i) =&gt; Number((i * messageDelta).toFixed(2)),
        );
        let receiver = messages.slice();
        let sender = null;
        let pendingSender = null;
        let firstStableEven = null;
        const snapshots = [{ level: 0, role: &quot;Receiver&quot;, sender: null, receiver }];

        for (let level = 1; ; level += 1) {
          if (level % 2 === 1) {
            sender = pendingSender || bestSender(states, receiver);
            pendingSender = null;
          } else {
            const sums = new Float64Array(messages.length);
            const counts = new Uint32Array(messages.length);
            states.forEach((state, stateIndex) =&gt; {
              const index = sender[stateIndex];
              sums[index] += state;
              counts[index] += 1;
            });
            receiver = messages.slice();
            for (let i = 0; i &lt; messages.length; i += 1) {
              if (counts[i]) receiver[i] = sums[i] / counts[i];
            }
            pendingSender = bestSender(states, receiver);
            if (firstStableEven === null &amp;&amp; arraysEqual(pendingSender, sender)) firstStableEven = level;
          }
          snapshots.push({
            level,
            role: level % 2 ? &quot;Sender&quot; : &quot;Receiver&quot;,
            sender,
            receiver,
          });
          if (firstStableEven !== null &amp;&amp; level &gt;= firstStableEven + 2) break;
        }

        const maxLevel = snapshots.length - 1;
        const model = {
          stateDelta,
          messageDelta,
          states,
          messages,
          snapshots,
          maxLevel,
          stabilized: firstStableEven !== null &amp;&amp; maxLevel &gt;= firstStableEven + 2,
        };
        cache.set(key, model);
        return model;
      }

      const slider = root.querySelector(&quot;#lkg-slider&quot;);
      const deltaSelect = root.querySelector(&quot;#lkg-delta&quot;);
      const stateDeltaSelect = root.querySelector(&quot;#lkg-state-delta&quot;);
      const prev = root.querySelector(&quot;#lkg-prev&quot;);
      const next = root.querySelector(&quot;#lkg-next&quot;);
      const levelLabel = root.querySelector(&quot;#lkg-level-label&quot;);
      const status = root.querySelector(&quot;#lkg-status&quot;);
      const senderSubtitle = root.querySelector(&quot;#lkg-sender-subtitle&quot;);
      const receiverSubtitle = root.querySelector(&quot;#lkg-receiver-subtitle&quot;);
      const outcomeSubtitle = root.querySelector(&quot;#lkg-outcome-subtitle&quot;);
      const detail = root.querySelector(&quot;#lkg-detail&quot;);
      const tooltip = root.querySelector(&quot;#lkg-tooltip&quot;);
      let model = buildModel(1, 1);
      let currentLevel = 0;
      let resizeFrame = null;

      function poolsFor(snapshot) {
        const pools = new Map();
        if (snapshot.sender) {
          model.states.forEach((state, stateIndex) =&gt; {
            const index = snapshot.sender[stateIndex];
            if (!pools.has(index)) pools.set(index, { first: state, last: state, count: 0 });
            const pool = pools.get(index);
            pool.last = state;
            pool.count += 1;
          });
        }
        return pools;
      }

      function formatNumber(value) {
        const rounded = Math.round(value * 100) / 100;
        return rounded.toFixed(2).replace(/\.00$/, &quot;&quot;).replace(/(\.\d)0$/, &quot;$1&quot;);
      }

      function profileMse(snapshot) {
        if (!snapshot.sender) return null;
        let total = 0;
        model.states.forEach((state, stateIndex) =&gt; {
          const guess = snapshot.receiver[snapshot.sender[stateIndex]];
          const error = guess - state;
          total += error * error;
        });
        return total / model.states.length;
      }

      function showTooltip(event, text) {
        const rootRect = root.getBoundingClientRect();
        tooltip.textContent = text;
        tooltip.style.display = &quot;block&quot;;
        tooltip.style.left = `${Math.max(8, Math.min(event.clientX - rootRect.left + 12, rootRect.width - tooltip.offsetWidth - 8))}px`;
        tooltip.style.top = `${event.clientY - rootRect.top + 12}px`;
        detail.textContent = text;
      }

      function hideTooltip() { tooltip.style.display = &quot;none&quot;; }

      function addAxes(svg, width, height, margins, xScale, yScale, xTicks, yTicks, xTitle, yTitle) {
        const plotWidth = width - margins.left - margins.right;
        const plotHeight = height - margins.top - margins.bottom;
        svg.append(&quot;rect&quot;).attr(&quot;data-chart-frame&quot;, &quot;&quot;)
          .attr(&quot;x&quot;, margins.left).attr(&quot;y&quot;, margins.top)
          .attr(&quot;width&quot;, plotWidth).attr(&quot;height&quot;, plotHeight);
        yTicks.forEach(tick =&gt; {
          svg.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;lk-grid&quot;)
            .attr(&quot;x1&quot;, margins.left).attr(&quot;x2&quot;, width - margins.right)
            .attr(&quot;y1&quot;, yScale(tick)).attr(&quot;y2&quot;, yScale(tick));
          svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;lk-tick&quot;)
            .attr(&quot;x&quot;, margins.left - 8).attr(&quot;y&quot;, yScale(tick) + 4)
            .attr(&quot;text-anchor&quot;, &quot;end&quot;).text(tick);
        });
        xTicks.forEach(tick =&gt; {
          svg.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;lk-grid&quot;)
            .attr(&quot;x1&quot;, xScale(tick)).attr(&quot;x2&quot;, xScale(tick))
            .attr(&quot;y1&quot;, margins.top).attr(&quot;y2&quot;, height - margins.bottom);
          svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;lk-tick&quot;)
            .attr(&quot;x&quot;, xScale(tick)).attr(&quot;y&quot;, height - margins.bottom + 18)
            .attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(tick);
        });
        svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;x&quot;)
          .attr(&quot;x&quot;, margins.left + plotWidth / 2).attr(&quot;y&quot;, height - 8)
          .attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(xTitle);
        svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;y&quot;)
          .attr(&quot;transform&quot;, `translate(15 ${margins.top + plotHeight / 2}) rotate(-90)`)
          .attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(yTitle);
      }

      function addNearestOverlay(svg, width, height, margins, scaleX, data, valueX, valueY, tooltipText) {
        const guide = svg.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;lk-guide&quot;).style(&quot;display&quot;, &quot;none&quot;);
        const marker = svg.append(&quot;circle&quot;).attr(&quot;class&quot;, &quot;lk-hover-marker&quot;).attr(&quot;r&quot;, 5).style(&quot;display&quot;, &quot;none&quot;);
        svg.append(&quot;rect&quot;)
          .attr(&quot;class&quot;, &quot;lk-overlay&quot;)
          .attr(&quot;data-chart-hit&quot;, &quot;&quot;)
          .attr(&quot;x&quot;, margins.left).attr(&quot;y&quot;, margins.top)
          .attr(&quot;width&quot;, width - margins.left - margins.right)
          .attr(&quot;height&quot;, height - margins.top - margins.bottom)
          .on(&quot;pointermove&quot;, event =&gt; {
            const [pointerX] = d3.pointer(event);
            const target = scaleX.invert(pointerX);
            const index = d3.bisector(valueX).center(data, target);
            const datum = data[index];
            guide.style(&quot;display&quot;, null)
              .attr(&quot;x1&quot;, scaleX(valueX(datum))).attr(&quot;x2&quot;, scaleX(valueX(datum)))
              .attr(&quot;y1&quot;, margins.top).attr(&quot;y2&quot;, height - margins.bottom);
            marker.style(&quot;display&quot;, null)
              .attr(&quot;cx&quot;, scaleX(valueX(datum))).attr(&quot;cy&quot;, valueY(datum));
            showTooltip(event, tooltipText(datum));
          })
          .on(&quot;pointerleave&quot;, () =&gt; {
            guide.style(&quot;display&quot;, &quot;none&quot;);
            marker.style(&quot;display&quot;, &quot;none&quot;);
            hideTooltip();
          });
      }

      function appendReference(svg, data, xScale, yScale, className, xValue, yValue) {
        svg.append(&quot;path&quot;).datum(data)
          .attr(&quot;class&quot;, `lk-reference ${className}`)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; xScale(xValue(d))).y(d =&gt; yScale(yValue(d))));
      }

      function drawSender(snapshot) {
        const container = root.querySelector(&quot;#lkg-sender-chart&quot;);
        container.innerHTML = &quot;&quot;;
        const width = Math.round(container.getBoundingClientRect().width);
        const margins = { top: 16, right: 20, bottom: 46, left: 64 };
        const plotWidth = width - margins.left - margins.right;
        const height = margins.top + margins.bottom + plotWidth / 2;
        const svg = d3.select(container).append(&quot;svg&quot;)
          .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
          .attr(&quot;role&quot;, &quot;img&quot;)
          .attr(&quot;aria-labelledby&quot;, &quot;lkg-sender-svg-title lkg-sender-svg-desc&quot;);
        svg.append(&quot;title&quot;).attr(&quot;id&quot;, &quot;lkg-sender-svg-title&quot;).text(`Sender policy at level ${snapshot.level}`);
        svg.append(&quot;desc&quot;).attr(&quot;id&quot;, &quot;lkg-sender-svg-desc&quot;).text(&quot;Current sender policy with dashed m equals theta and m equals theta over two reference lines.&quot;);
        const x = d3.scaleLinear().domain([0, 100]).range([margins.left, width - margins.right]);
        const y = d3.scaleLinear().domain([0, 50]).range([height - margins.bottom, margins.top]);
        const xTicks = width &lt; 430 ? [0, 50, 100] : [0, 20, 40, 60, 80, 100];
        const yTicks = width &lt; 430 ? [0, 20, 40, 50] : [0, 10, 20, 30, 40, 50];
        addAxes(svg, width, height, margins, x, y, xTicks, yTicks, &quot;State θ&quot;, &quot;Message m&quot;);
        appendReference(svg, [{ state: 0, message: 0 }, { state: 50, message: 50 }], x, y, &quot;lk-ref-identity&quot;, d =&gt; d.state, d =&gt; d.message);
        appendReference(svg, [{ state: 0, message: 0 }, { state: 100, message: 50 }], x, y, &quot;lk-ref-scaled&quot;, d =&gt; d.state, d =&gt; d.message);
        if (!snapshot.sender) {
          svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;lk-empty&quot;)
            .attr(&quot;x&quot;, margins.left + (width - margins.left - margins.right) / 2)
            .attr(&quot;y&quot;, margins.top + (height - margins.top - margins.bottom) / 2)
            .text(&quot;Sender reasoning begins at Level 1&quot;);
          return;
        }
        const data = Array.from(model.states, (state, stateIndex) =&gt; ({
          state,
          messageIndex: snapshot.sender[stateIndex],
          message: model.messages[snapshot.sender[stateIndex]],
        }));
        svg.append(&quot;path&quot;).datum(data).attr(&quot;class&quot;, &quot;lk-line-sender&quot;)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; x(d.state)).y(d =&gt; y(d.message)));
        const senderSampleStep = Math.max(1, Math.ceil(data.length / 240));
        const senderSample = data.filter((datum, index) =&gt; index % senderSampleStep === 0 || index === data.length - 1);
        svg.selectAll(&quot;circle.lk-dot-sender&quot;).data(senderSample).join(&quot;circle&quot;)
          .attr(&quot;class&quot;, &quot;lk-dot-sender&quot;)
          .attr(&quot;cx&quot;, d =&gt; x(d.state)).attr(&quot;cy&quot;, d =&gt; y(d.message)).attr(&quot;r&quot;, 2.2);
        addNearestOverlay(svg, width, height, margins, x, data, d =&gt; d.state, d =&gt; y(d.message), datum =&gt; {
          const guess = snapshot.receiver[datum.messageIndex];
          return `State ${datum.state} → message ${formatNumber(datum.message)} → guess ${formatNumber(guess)}; error ${formatNumber(Math.abs(guess - datum.state))}`;
        });
      }

      function drawReceiver(snapshot) {
        const container = root.querySelector(&quot;#lkg-receiver-chart&quot;);
        container.innerHTML = &quot;&quot;;
        const width = Math.round(container.getBoundingClientRect().width);
        const margins = { top: 16, right: 20, bottom: 46, left: 64 };
        const plotWidth = width - margins.left - margins.right;
        const height = margins.top + margins.bottom + plotWidth * 2;
        const svg = d3.select(container).append(&quot;svg&quot;)
          .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
          .attr(&quot;role&quot;, &quot;img&quot;)
          .attr(&quot;aria-labelledby&quot;, &quot;lkg-receiver-svg-title lkg-receiver-svg-desc&quot;);
        svg.append(&quot;title&quot;).attr(&quot;id&quot;, &quot;lkg-receiver-svg-title&quot;).text(`Receiver policy at level ${snapshot.level}`);
        svg.append(&quot;desc&quot;).attr(&quot;id&quot;, &quot;lkg-receiver-svg-desc&quot;).text(&quot;Current receiver policy with dashed g of m equals m and g of m equals two m reference lines.&quot;);
        const x = d3.scaleLinear().domain([0, 50]).range([margins.left, width - margins.right]);
        const y = d3.scaleLinear().domain([0, 100]).range([height - margins.bottom, margins.top]);
        const xTicks = width &lt; 430 ? [0, 25, 50] : [0, 10, 20, 30, 40, 50];
        const yTicks = width &lt; 430 ? [0, 40, 80, 100] : [0, 20, 40, 60, 80, 100];
        addAxes(svg, width, height, margins, x, y, xTicks, yTicks, &quot;Message m&quot;, &quot;Receiver guess g(m)&quot;);
        appendReference(svg, [{ message: 0, guess: 0 }, { message: 50, guess: 50 }], x, y, &quot;lk-ref-identity&quot;, d =&gt; d.message, d =&gt; d.guess);
        appendReference(svg, [{ message: 0, guess: 0 }, { message: 50, guess: 100 }], x, y, &quot;lk-ref-scaled&quot;, d =&gt; d.message, d =&gt; d.guess);

        const pools = poolsFor(snapshot);
        const data = Array.from(model.messages, (message, index) =&gt; ({
          index,
          message,
          guess: snapshot.receiver[index],
          used: !snapshot.sender || pools.has(index),
          pool: pools.get(index) || null,
        }));
        const active = snapshot.sender ? data.filter(d =&gt; d.used) : data;
        svg.append(&quot;path&quot;).datum(active).attr(&quot;class&quot;, &quot;lk-line-receiver&quot;)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; x(d.message)).y(d =&gt; y(d.guess)));

        const sampleStep = Math.max(1, Math.ceil(data.length / 220));
        const includeEveryUsed = active.length &lt;= 300;
        const sample = data.filter((datum, index) =&gt;
          index % sampleStep === 0 || index === data.length - 1 || (includeEveryUsed &amp;&amp; datum.used));
        svg.selectAll(&quot;circle.lk-receiver-point&quot;).data(sample).join(&quot;circle&quot;)
          .attr(&quot;class&quot;, d =&gt; `lk-receiver-point ${d.used ? &quot;lk-dot-receiver&quot; : &quot;lk-dot-unused&quot;}`)
          .attr(&quot;cx&quot;, d =&gt; x(d.message)).attr(&quot;cy&quot;, d =&gt; y(d.guess)).attr(&quot;r&quot;, d =&gt; d.used ? 2.8 : 2);
        addNearestOverlay(svg, width, height, margins, x, data, d =&gt; d.message, d =&gt; y(d.guess), datum =&gt; {
          const source = datum.pool
            ? (datum.pool.count === 1
              ? `state ${formatNumber(datum.pool.first)}`
              : `states ${formatNumber(datum.pool.first)}–${formatNumber(datum.pool.last)}`)
            : &quot;unused; literal off-path interpretation&quot;;
          return `Message ${formatNumber(datum.message)} → guess ${formatNumber(datum.guess)} (${source})`;
        });
      }

      function drawOutcome(snapshot) {
        const container = root.querySelector(&quot;#lkg-outcome-chart&quot;);
        container.innerHTML = &quot;&quot;;
        const width = Math.round(container.getBoundingClientRect().width);
        const margins = { top: 16, right: 20, bottom: 46, left: 64 };
        const plotWidth = width - margins.left - margins.right;
        const height = margins.top + margins.bottom + plotWidth;
        const svg = d3.select(container).append(&quot;svg&quot;)
          .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
          .attr(&quot;role&quot;, &quot;img&quot;)
          .attr(&quot;aria-labelledby&quot;, &quot;lkg-outcome-svg-title lkg-outcome-svg-desc&quot;);
        svg.append(&quot;title&quot;).attr(&quot;id&quot;, &quot;lkg-outcome-svg-title&quot;).text(`State-to-guess outcome at level ${snapshot.level}`);
        svg.append(&quot;desc&quot;).attr(&quot;id&quot;, &quot;lkg-outcome-svg-desc&quot;).text(&quot;Receiver guess generated by each state, with a dashed identity reference line where the guess equals the state.&quot;);
        const x = d3.scaleLinear().domain([0, 100]).range([margins.left, width - margins.right]);
        const y = d3.scaleLinear().domain([0, 100]).range([height - margins.bottom, margins.top]);
        const xTicks = width &lt; 430 ? [0, 50, 100] : [0, 20, 40, 60, 80, 100];
        const yTicks = width &lt; 430 ? [0, 40, 80, 100] : [0, 20, 40, 60, 80, 100];
        addAxes(svg, width, height, margins, x, y, xTicks, yTicks, &quot;State θ&quot;, &quot;Receiver guess g(m)&quot;);
        appendReference(svg, [{ state: 0, guess: 0 }, { state: 100, guess: 100 }], x, y, &quot;lk-ref-identity&quot;, d =&gt; d.state, d =&gt; d.guess);
        if (!snapshot.sender) {
          svg.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;lk-empty&quot;)
            .attr(&quot;x&quot;, margins.left + (width - margins.left - margins.right) / 2)
            .attr(&quot;y&quot;, margins.top + (height - margins.top - margins.bottom) / 2)
            .text(&quot;Outcome mapping begins at Level 1&quot;);
          return;
        }

        const data = Array.from(model.states, (state, stateIndex) =&gt; {
          const messageIndex = snapshot.sender[stateIndex];
          return {
            state,
            message: model.messages[messageIndex],
            guess: snapshot.receiver[messageIndex],
          };
        });
        svg.append(&quot;path&quot;).datum(data).attr(&quot;class&quot;, &quot;lk-line-outcome&quot;)
          .attr(&quot;d&quot;, d3.line().x(d =&gt; x(d.state)).y(d =&gt; y(d.guess)));
        const sampleStep = Math.max(1, Math.ceil(data.length / 240));
        const sample = data.filter((datum, index) =&gt; index % sampleStep === 0 || index === data.length - 1);
        svg.selectAll(&quot;circle.lk-dot-outcome&quot;).data(sample).join(&quot;circle&quot;)
          .attr(&quot;class&quot;, &quot;lk-dot-outcome&quot;)
          .attr(&quot;cx&quot;, d =&gt; x(d.state)).attr(&quot;cy&quot;, d =&gt; y(d.guess)).attr(&quot;r&quot;, 2.2);
        addNearestOverlay(svg, width, height, margins, x, data, d =&gt; d.state, d =&gt; y(d.guess), datum =&gt;
          `State ${formatNumber(datum.state)} → guess ${formatNumber(datum.guess)} via message ${formatNumber(datum.message)}; error ${formatNumber(Math.abs(datum.guess - datum.state))}`);
      }

      function render() {
        const snapshot = model.snapshots[currentLevel];
        slider.max = String(model.maxLevel);
        slider.value = String(currentLevel);
        slider.setAttribute(&quot;aria-label&quot;, `Level from 0 to ${model.maxLevel}`);
        prev.disabled = currentLevel === 0;
        next.disabled = currentLevel === model.maxLevel;
        levelLabel.textContent = `Level ${currentLevel} · ${snapshot.role}${currentLevel === model.maxLevel &amp;&amp; model.stabilized ? &quot; · stationary&quot; : &quot;&quot;}`;
        const mse = profileMse(snapshot);
        const used = snapshot.sender ? new Set(snapshot.sender).size : null;
        status.textContent = snapshot.sender
          ? `States every ${formatNumber(model.stateDelta)} · messages every ${formatNumber(model.messageDelta)} · ${snapshot.role} update · ${used} of ${model.messages.length} messages used · profile MSE ${mse.toFixed(6)}`
          : `States every ${formatNumber(model.stateDelta)} · messages every ${formatNumber(model.messageDelta)} · receiver baseline g(m) = m · ${model.states.length} states · ${model.messages.length} messages`;
        senderSubtitle.textContent = currentLevel === 0
          ? &quot;Not yet specified&quot;
          : currentLevel % 2 ? &quot;Current best response&quot; : `Inherited from Level ${currentLevel - 1}`;
        receiverSubtitle.textContent = currentLevel === 0
          ? &quot;Current baseline&quot;
          : currentLevel % 2 ? `Beliefs inherited from Level ${currentLevel - 1}` : &quot;Current posterior-mean best response&quot;;
        outcomeSubtitle.textContent = currentLevel === 0
          ? &quot;Not yet defined&quot;
          : &quot;Current composed outcome&quot;;
        detail.textContent = currentLevel === model.maxLevel
          ? (model.stabilized
            ? `Stationary partition reached: ${used} messages used; MSE ${mse.toFixed(6)}.`
            : `Level ${model.maxLevel} displayed; the profile has not stabilized within the display limit.`)
          : &quot;Move over any chart to inspect the mapping.&quot;;
        hideTooltip();
        drawSender(snapshot);
        drawReceiver(snapshot);
        drawOutcome(snapshot);
      }

      prev.addEventListener(&quot;click&quot;, () =&gt; { if (currentLevel &gt; 0) { currentLevel -= 1; render(); } });
      next.addEventListener(&quot;click&quot;, () =&gt; { if (currentLevel &lt; model.maxLevel) { currentLevel += 1; render(); } });
      slider.addEventListener(&quot;input&quot;, () =&gt; { currentLevel = Number(slider.value); render(); });
      function updateModelFromControls() {
        model = buildModel(Number(stateDeltaSelect.value), Number(deltaSelect.value));
        currentLevel = Math.min(currentLevel, model.maxLevel);
        render();
      }
      deltaSelect.addEventListener(&quot;change&quot;, updateModelFromControls);
      stateDeltaSelect.addEventListener(&quot;change&quot;, updateModelFromControls);
      new ResizeObserver(() =&gt; {
        if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(render);
      }).observe(root.querySelector(&quot;.lk-panels&quot;));
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);

    const trigger = getTrigger(event.target);

    const trigger = getTrigger(event.target);

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
