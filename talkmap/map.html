<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Thaler's talk map</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9TM195RVGW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9TM195RVGW');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.css">
    <link rel="stylesheet" href="leaflet_dist/screen.css">
    <link rel="stylesheet" href="leaflet_dist/MarkerCluster.css">
    <link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.js"></script>
    <script src="leaflet_dist/leaflet.markercluster-src.js"></script>
    <script src="org-locations.js"></script>
  </head>
  <body>
    <main class="talk-map-shell">
      <div id="map" aria-label="Map of Michael Thaler's academic talks: in-person talks in green, virtual talks in purple, and scheduled talks in blue"></div>
    </main>

    <script>
      var map = L.map('map', { center: [35, 0], zoom: 2 });
      var tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });
      var categoryOrder = ['in-person', 'virtual', 'scheduled'];
      var countryCenters = {
        Australia: [-25.2744, 133.7751],
        Austria: [47.5162, 14.5501],
        Canada: [56.1304, -106.3468],
        France: [46.2276, 2.2137],
        Germany: [51.1657, 10.4515],
        Italy: [41.8719, 12.5674],
        Japan: [36.2048, 138.2529],
        Luxembourg: [49.8153, 6.1296],
        Netherlands: [52.1326, 5.2913],
        Norway: [60.472, 8.4689],
        Spain: [40.4637, -3.7492],
        Sweden: [60.1282, 18.6435],
        Switzerland: [46.8182, 8.2275],
        UK: [55.3781, -3.436],
        Uruguay: [-32.5228, -55.7658],
        USA: [39.8283, -98.5795]
      };

      function getTalkCategory(talk) {
        return talk.scheduled ? 'scheduled' : (talk.virtual ? 'virtual' : 'in-person');
      }

      function getTalkCountry(talk) {
        var locationWithoutNote = talk.location.replace(/\s*\([^)]*\)\s*$/, '');
        var locationParts = locationWithoutNote.split(',');
        return locationParts[locationParts.length - 1].trim();
      }

      function getCategoryClass(talks, classPrefix) {
        var categories = {};
        talks.forEach(function (talk) {
          categories[getTalkCategory(talk)] = true;
        });
        var presentCategories = categoryOrder.filter(function (category) {
          return categories[category];
        });

        return presentCategories.length === 1
          ? classPrefix + presentCategories[0]
          : classPrefix + 'mixed ' + classPrefix + 'mixed-' + presentCategories.join('-');
      }

      var countryGroups = {};
      talkLocations.forEach(function (talk) {
        var country = getTalkCountry(talk);
        countryGroups[country] = countryGroups[country] || [];
        countryGroups[country].push(talk);
      });

      var markers = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 70,
        iconCreateFunction: function (cluster) {
          var categories = {};
          cluster.getAllChildMarkers().forEach(function (marker) {
            categories[marker.options.talkCategory] = true;
          });
          var presentCategories = categoryOrder.filter(function (category) {
            return categories[category];
          });
          var categoryClass = presentCategories.length === 1
            ? 'marker-cluster-' + presentCategories[0]
            : 'marker-cluster-mixed marker-cluster-mixed-' + presentCategories.join('-');

          return L.divIcon({
            html: '<div><span>' + cluster.getChildCount() + '</span></div>',
            className: 'marker-cluster ' + categoryClass,
            iconSize: L.point(40, 40)
          });
        }
      });
      var inPersonTalks = talkLocations.filter(function (talk) { return !talk.virtual && !talk.scheduled; });
      var virtualTalks = talkLocations.filter(function (talk) { return talk.virtual; });
      var scheduledTalks = talkLocations.filter(function (talk) { return talk.scheduled; });
      var pinSvg =
        '<svg viewBox="0 0 24 32" aria-hidden="true" focusable="false">' +
          '<path d="M12 1C5.9 1 1 5.9 1 12c0 8.2 11 19 11 19s11-10.8 11-19C23 5.9 18.1 1 12 1z"></path>' +
          '<circle cx="12" cy="12" r="4"></circle>' +
        '</svg>';
      var inPersonIcon = L.divIcon({
        html: '<span class="talk-marker__pin talk-marker__pin--in-person">' + pinSvg + '</span>',
        className: 'talk-marker talk-marker--in-person',
        iconSize: [28, 36],
        iconAnchor: [14, 34],
        popupAnchor: [0, -32]
      });
      var virtualIcon = L.divIcon({
        html: '<span class="talk-marker__pin talk-marker__pin--virtual">' + pinSvg + '</span>',
        className: 'talk-marker talk-marker--virtual',
        iconSize: [28, 36],
        iconAnchor: [14, 34],
        popupAnchor: [0, -32]
      });
      var scheduledIcon = L.divIcon({
        html: '<span class="talk-marker__pin talk-marker__pin--scheduled">' + pinSvg + '</span>',
        className: 'talk-marker talk-marker--scheduled',
        iconSize: [28, 36],
        iconAnchor: [14, 34],
        popupAnchor: [0, -32]
      });

      tiles.addTo(map);

      talkLocations.forEach(function (talk) {
        var role = talk.role || 'Presentation';
        var format = talk.scheduled ? 'Scheduled presentation' : (talk.virtual ? 'Virtual presentation' : role);
        var popup =
          '<div class="talk-popup">' +
            '<strong>' + talk.venue + '</strong>' +
            '<span>' + format + ' &middot; ' + talk.year + '</span>' +
            '<span>' + (talk.virtual ? 'Mapped to ' : '') + talk.location + '</span>' +
          '</div>';
        var marker = L.marker([talk.lat, talk.lng], {
          title: talk.venue + ' (' + talk.year + ')' + (talk.scheduled ? ' — scheduled' : (talk.virtual ? ' — virtual' : '')),
          icon: talk.scheduled ? scheduledIcon : (talk.virtual ? virtualIcon : inPersonIcon),
          talkCategory: getTalkCategory(talk)
        });

        marker.bindPopup(popup);
        markers.addLayer(marker);
      });

      var countryLayer = L.featureGroup();
      var showingCountryOverview = true;
      var detailZoomThreshold = 2;
      var europeDetailZoomThreshold = detailZoomThreshold + 3;

      function getCurrentDetailZoomThreshold() {
        var center = map.getCenter();
        var isCenteredOnEurope = center.lat >= 34 && center.lat <= 72 && center.lng >= -25 && center.lng <= 45;
        return isCenteredOnEurope ? europeDetailZoomThreshold : detailZoomThreshold;
      }

      function showTalkDetails() {
        showingCountryOverview = false;
        if (map.hasLayer(countryLayer)) {
          map.removeLayer(countryLayer);
        }
        if (!map.hasLayer(markers)) {
          map.addLayer(markers);
        }
      }

      function showCountryTalks(talks) {
        showTalkDetails();

        var talkBounds = L.latLngBounds(talks.map(function (talk) {
          return [talk.lat, talk.lng];
        }));
        var southWest = talkBounds.getSouthWest();
        var northEast = talkBounds.getNorthEast();
        var isSingleLocation = southWest.lat === northEast.lat && southWest.lng === northEast.lng;

        if (isSingleLocation) {
          map.setView(talkBounds.getCenter(), 6);
        } else {
          map.fitBounds(talkBounds, {
            padding: [60, 60],
            maxZoom: 6
          });
        }
      }

      Object.keys(countryGroups).sort().forEach(function (country) {
        var talks = countryGroups[country];
        var countryCenter = countryCenters[country] || [
          talks.reduce(function (total, talk) { return total + talk.lat; }, 0) / talks.length,
          talks.reduce(function (total, talk) { return total + talk.lng; }, 0) / talks.length
        ];
        var countryIcon = L.divIcon({
          html: '<span class="country-marker__bubble ' + getCategoryClass(talks, 'country-marker__bubble--') + '">' +
            '<span>' + talks.length + '</span>' +
          '</span>',
          className: 'country-marker',
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });
        var countryMarker = L.marker(countryCenter, {
          title: country + ' — ' + talks.length + (talks.length === 1 ? ' talk' : ' talks'),
          icon: countryIcon
        });

        countryMarker.on('click', function () {
          showCountryTalks(talks);
        });
        countryLayer.addLayer(countryMarker);
      });

      function showCountryOverview() {
        showingCountryOverview = true;
        if (map.hasLayer(markers)) {
          map.removeLayer(markers);
        }
        if (!map.hasLayer(countryLayer)) {
          map.addLayer(countryLayer);
        }
      }

      function updateLayerForMapView() {
        var currentDetailZoomThreshold = getCurrentDetailZoomThreshold();
        if (showingCountryOverview && map.getZoom() > currentDetailZoomThreshold) {
          showTalkDetails();
        } else if (!showingCountryOverview && map.getZoom() <= currentDetailZoomThreshold) {
          showCountryOverview();
        }
      }

      map.on('zoomend moveend', updateLayerForMapView);

      showCountryOverview();
      map.fitBounds(countryLayer.getBounds(), {
        padding: [24, 24],
        maxZoom: detailZoomThreshold
      });

      var legend = L.control({ position: 'topright' });
      legend.onAdd = function () {
        var container = L.DomUtil.create('div', 'talk-legend');
        var inPersonItems = inPersonTalks.map(function (talk) {
          return '<li><strong>' + talk.year + '</strong><span>' +
            '<span>' + talk.venue + '</span><small>' + talk.location + '</small>' +
          '</span></li>';
        }).join('');
        var virtualItems = virtualTalks.map(function (talk) {
          return '<li><strong>' + talk.year + '</strong><span>' +
            '<span>' + talk.venue + '</span><small>' + talk.location + '</small>' +
          '</span></li>';
        }).join('');
        var scheduledItems = scheduledTalks.map(function (talk) {
          return '<li><strong>' + talk.year + '</strong><span>' +
            '<span>' + talk.venue + '</span><small>' + talk.location + '</small>' +
          '</span></li>';
        }).join('');

        container.setAttribute('aria-label', 'Talk format legend');
        container.innerHTML =
          '<details class="in-person-talks">' +
            '<summary>' +
              '<span class="talk-legend__dot talk-legend__dot--in-person" aria-hidden="true"></span>' +
              '<span>In Person (' + inPersonTalks.length + ')</span>' +
            '</summary>' +
            '<ul>' + inPersonItems + '</ul>' +
          '</details>' +
          '<details class="virtual-talks">' +
            '<summary>' +
              '<span class="talk-legend__dot talk-legend__dot--virtual" aria-hidden="true"></span>' +
              '<span>Virtual (' + virtualTalks.length + ')</span>' +
            '</summary>' +
            '<ul>' + virtualItems + '</ul>' +
          '</details>' +
          '<details class="scheduled-talks">' +
            '<summary>' +
              '<span class="talk-legend__dot talk-legend__dot--scheduled" aria-hidden="true"></span>' +
              '<span>Scheduled (' + scheduledTalks.length + ')</span>' +
            '</summary>' +
            '<ul>' + scheduledItems + '</ul>' +
          '</details>';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);
        return container;
      };
      legend.addTo(map);
    </script>
  </body>
</html>
